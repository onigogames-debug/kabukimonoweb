<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KABUKIMONO Instagram Cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Yuji+Syuku&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #050505;
      color: #fff;
      font-family: "Noto Sans JP", sans-serif;
    }
    .stage { display: grid; gap: 40px; padding: 40px; }
    .card {
      position: relative;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 16%, rgba(255, 0, 51, 0.42), transparent 24%),
        radial-gradient(circle at 78% 76%, rgba(212, 175, 55, 0.24), transparent 28%),
        linear-gradient(135deg, #070707 0%, #150606 54%, #070707 100%);
      border: 1px solid rgba(212, 175, 55, 0.52);
      padding: 86px;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 44px;
      border: 1px solid rgba(212, 175, 55, 0.32);
    }
    .eyebrow {
      position: relative;
      color: #d4af37;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.24em;
      margin-bottom: 42px;
    }
    .headline {
      position: relative;
      font-family: "Yuji Syuku", serif;
      font-size: 96px;
      line-height: 1.22;
      margin: 0;
      text-shadow: 0 18px 42px rgba(0, 0, 0, 0.72);
    }
    .headline .red { color: #ff0033; }
    .body {
      position: relative;
      color: rgba(255, 255, 255, 0.82);
      font-size: 34px;
      font-weight: 700;
      line-height: 1.72;
      margin-top: 48px;
      max-width: 840px;
    }
    .cover {
      position: absolute;
      right: 86px;
      bottom: 108px;
      width: 300px;
      border: 1px solid rgba(212, 175, 55, 0.72);
      box-shadow: 0 26px 68px rgba(0, 0, 0, 0.72), 0 0 44px rgba(212, 175, 55, 0.22);
    }
    .url {
      position: absolute;
      left: 86px;
      bottom: 84px;
      color: #d4af37;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }
    .text-only .headline { font-size: 108px; }
    .text-only .body { max-width: 820px; }
  </style>
</head>
<body>
  <main class="stage">
    <section class="card" id="insta-01">
      <div class="eyebrow">KINDLE BOOK</div>
      <h1 class="headline">空気を読みながら、<br><span class="red">飲まれない。</span></h1>
      <p class="body">普通の会社員が出世する<br>「かぶきもの思考」</p>
      <img class="cover" src="../book_cover.jpg" alt="">
      <div class="url">kabukimonostore.com</div>
    </section>
    <section class="card text-only" id="insta-02">
      <div class="eyebrow">KABUKIMONO THINKING</div>
      <h1 class="headline">目立たなくていい。<br><span class="red">でも、牙は研いでおけ。</span></h1>
      <p class="body">組織の中で消耗せず、自分の軸を守りながら進む。</p>
      <div class="url">kabukimonostore.com</div>
    </section>
  </main>
</body>
</html>
